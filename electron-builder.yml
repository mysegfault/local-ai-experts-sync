appId: com.localaiexperts.sync
productName: Local AI Experts Sync
copyright: Copyright © Local AI Experts

directories:
  output: dist
  buildResources: build

files:
  - package.json
  - src/**/*
  - "!**/*.map"

extraResources:
  - from: src/main/askpass-helper.js
    to: askpass-helper.js

asar: true

win:
  target:
    - nsis
    - portable
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Local AI Experts Sync
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Local AI Experts
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
